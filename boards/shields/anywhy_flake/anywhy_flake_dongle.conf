CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Enable pointing for trackpoint listener HID reports
CONFIG_ZMK_POINTING=y

CONFIG_ZMK_SLEEP=n
# ZMK_IDLE_SLEEP_TIMEOUT requires ZMK_SLEEP=y to take effect; omitted to avoid warning.

# USB logging is disabled when using studio-rpc-usb-uart snippet,
# as ZMK Studio owns the USB CDC-ACM interface (conflicts with LOG_BACKEND_UART).
# CONFIG_ZMK_USB_LOGGING is not set

# Dongle-specific: delay log output so initial messages aren't truncated
CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=3000

# Battery level reporting from peripherals
CONFIG_ZMK_BATTERY_REPORTING=y
