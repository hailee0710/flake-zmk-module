CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Enable pointing for trackpoint listener HID reports
CONFIG_ZMK_POINTING=y

CONFIG_ZMK_SLEEP=n
# ZMK_IDLE_SLEEP_TIMEOUT requires ZMK_SLEEP=y to take effect; omitted to avoid warning.

# ---------------------------------------------------------------------------
# USB Logging vs ZMK Studio
# ---------------------------------------------------------------------------
# USB logging (CONFIG_ZMK_USB_LOGGING=y) and the studio-rpc-usb-uart snippet
# BOTH use the USB CDC-ACM interface — they CANNOT be used together.
#
# For normal builds: use the studio snippet (set in build.yaml)
# For debug builds:  comment out the studio snippet in build.yaml and
#                     uncomment CONFIG_ZMK_USB_LOGGING below.
#
# CONFIG_ZMK_USB_LOGGING=y
# CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=1000

# Satisfy hidden Kconfig dependencies that CONFIG_ZMK_USB_LOGGING needs.
# USB_CDC_ACM requires SERIAL, which requires SERIAL_HAS_DRIVER.
# UART_INTERRUPT_DRIVEN requires SERIAL_SUPPORT_INTERRUPT && SERIAL.
# These are normally provided by hardware UART drivers, but the dongle
# only uses USB CDC ACM (virtual serial), so we set them explicitly.
# CONFIG_SERIAL_HAS_DRIVER=y
# CONFIG_SERIAL_SUPPORT_INTERRUPT=y

# Dongle-specific: delay log output so initial messages aren't truncated
CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=3000

# Battery level reporting from peripherals
CONFIG_ZMK_BATTERY_REPORTING=y
