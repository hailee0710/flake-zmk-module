# 3 profiles (n+2)
CONFIG_BT_MAX_CONN=3
CONFIG_BT_MAX_PAIRED=3

CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

CONFIG_INPUT=y
CONFIG_ZMK_MOUSE=y

# Enable pointing for trackpoint listener HID reports
CONFIG_ZMK_POINTING=y

# display
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_IDLE_TIMEOUT=1800000
CONFIG_BT_BAS=n

# dongle_screen: animated eyes replace the layer label, plus the background
# effects layer behind everything else.
CONFIG_DONGLE_SCREEN_EYES_ACTIVE=y
CONFIG_DONGLE_SCREEN_BACKGROUND_ACTIVE=y
CONFIG_DONGLE_SCREEN_LAYER_ACTIVE=n

# Dongle stays awake (central, ZMK Studio host)
CONFIG_ZMK_SLEEP=n

# Enable ZMK Studio for keymap editing
CONFIG_ZMK_STUDIO=y

# Disable Studio locking — keep always accessible
CONFIG_ZMK_STUDIO_LOCKING=n

# USB logging is available via the zmk-usb-logging snippet.
# Add `snippet: zmk-usb-logging` to build.yaml (instead of studio-rpc-usb-uart)
# when you need USB logging for debugging.  The two snippets are mutually
# exclusive — both use USB CDC-ACM.

# Dongle-specific: delay log output so initial messages aren't truncated
CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=3000

# Battery level reporting from peripherals
CONFIG_ZMK_BATTERY_REPORTING=y
