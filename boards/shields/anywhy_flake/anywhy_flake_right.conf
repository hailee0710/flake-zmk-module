# Right side is a split peripheral (not central)
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=n

# Enable BLE and BLE split transport
CONFIG_ZMK_BLE=y
CONFIG_ZMK_SPLIT_BLE=y

# Enable pointing/mouse support for trackpoint
CONFIG_ZMK_POINTING=y
CONFIG_INPUT=y

# GPIO support (needed for PS/2 clock/data pins and reset)
CONFIG_GPIO=y

# Required for PS/2 UART driver to receive trackpoint data via interrupts
CONFIG_UART_INTERRUPT_DRIVEN=y

# Battery reporting to central
CONFIG_ZMK_BATTERY_REPORTING=y

# Sleep after 1h idle
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=3600000
